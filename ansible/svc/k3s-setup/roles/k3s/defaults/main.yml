---
k3s_version: v1.37.1+k3s1
k3s_bootstrap_host: "{{ groups['k3s_servers'] | first }}"
k3s_api_endpoint: "https://{{ hostvars[k3s_bootstrap_host].ansible_host }}:6443"
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
k3s_disable_components:
  - traefik
  - servicelb
k3s_etcd_snapshot_schedule: "0 */6 * * *"
k3s_etcd_snapshot_retention: 10
