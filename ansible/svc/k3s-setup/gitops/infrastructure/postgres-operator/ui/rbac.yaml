apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-operator-ui
  namespace: postgres-operator
  annotations:
    argocd.argoproj.io/sync-wave: '5'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-operator-ui
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: '5'
rules:
  - apiGroups: [acid.zalan.do]
    resources: [postgresqls]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
  - apiGroups: ['']
    resources: [services]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-operator-ui
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: '5'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-operator-ui
subjects:
  - kind: ServiceAccount
    name: postgres-operator-ui
    namespace: postgres-operator
