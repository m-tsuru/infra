apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postgres-operator
resources:
  - ../vendor
patches:
  - path: deployment.yaml
  - target:
      kind: Service
      name: postgres-operator-ui
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: '5'
