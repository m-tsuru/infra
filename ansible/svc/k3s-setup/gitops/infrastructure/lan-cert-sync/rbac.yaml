apiVersion: v1
kind: ServiceAccount
metadata:
  name: lan-cert-sync
  namespace: argocd
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lan-cert-sync
  namespace: argocd
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [lan-apps-tls]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lan-cert-sync
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: lan-cert-sync
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lan-cert-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lan-cert-sync
  namespace: postgres-operator
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [lan-apps-tls]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lan-cert-sync
  namespace: postgres-operator
subjects:
  - kind: ServiceAccount
    name: lan-cert-sync
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lan-cert-sync
