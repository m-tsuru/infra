apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  timeout: 60s
  url: https://github.com/m-tsuru/infra
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./ansible/svc/k3s-setup/gitops/clusters/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
