apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./ansible/svc/k3s-setup/gitops/infrastructure/sealed-secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
