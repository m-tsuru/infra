apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  # Bootstrap root is applied separately: ignore-healthcheck does not bypass sync-wave waits.
  - argocd.yaml
  - sealed-secrets.yaml
  - postgres-operator.yaml
  - apps.yaml
  - metallb.yaml
  - metallb-config.yaml
  - traefik.yaml
  - lan-dns.yaml
  - lan-routes.yaml
