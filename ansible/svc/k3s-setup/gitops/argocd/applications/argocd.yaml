apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: default
  source:
    repoURL: https://github.com/m-tsuru/infra.git
    targetRevision: main
    path: ansible/svc/k3s-setup/gitops/argocd/install
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: ''
      kind: Secret
      name: argocd-secret
      namespace: argocd
      jsonPointers:
        - /data
    - group: ''
      kind: Secret
      name: argocd-notifications-secret
      namespace: argocd
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
      - ClientSideApplyMigration=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
