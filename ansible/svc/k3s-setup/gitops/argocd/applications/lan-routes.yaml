apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-lan-routes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  project: default
  source:
    repoURL: https://github.com/m-tsuru/infra.git
    targetRevision: main
    path: ansible/svc/k3s-setup/gitops/infrastructure/lan-routes
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
    - FailOnSharedResource=true
    - ClientSideApplyMigration=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
