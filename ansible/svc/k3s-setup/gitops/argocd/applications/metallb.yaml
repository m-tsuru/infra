apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-19'
spec:
  project: default
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.16.1
    helm:
      releaseName: metallb
      valuesObject:
        frrk8s:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: false
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
    - FailOnSharedResource=true
    - ClientSideApplyMigration=false
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
